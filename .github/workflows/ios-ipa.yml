name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-ipa.yml'

jobs:
  build-ipa:
    name: Build Unsigned iOS Release IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npx --yes npm@10.9.3 ci --include=dev

      - name: Verify app assets
        run: npm run verify:assets

      - name: Remove appleTeamId for unsigned CI prebuild
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("app.json", "utf8"));
            if (p.expo && p.expo.ios) delete p.expo.ios.appleTeamId;
            fs.writeFileSync("app.json", JSON.stringify(p, null, 2));
          '

      - name: Expo Prebuild (iOS)
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean

      - name: Disable code signing in Podfile for all Pod targets
        run: |
          node -e '
            const fs = require("fs");
            let podfile = fs.readFileSync("ios/Podfile", "utf8");
            const patch = `
    installer.pods_project.targets.each do |target|
      target.build_configurations.each do |config|
        config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
        config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
        config.build_settings["CODE_SIGN_IDENTITY"] = ""
        config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
      end
    end
  end
end`;
            podfile = podfile.replace(/  end\s*end\s*$/, patch);
            fs.writeFileSync("ios/Podfile", podfile);
          '

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS Release (.app) without code signing
        env:
          CI: '1'
          NODE_ENV: 'production'
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1
          XC_STATUS=$?
          if [ $XC_STATUS -ne 0 ]; then
            echo "xcodebuild failed with exit code $XC_STATUS"
            grep -E "(error:|fatal error:|❌|Command .* failed|requires a provisioning profile|No profiles|incompatible)" xcodebuild.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=XcodeError::$line"
            done
            tail -n 60 xcodebuild.log | while IFS= read -r line; do
              echo "::warning title=XcodeTail::$line"
            done
            tail -n 120 xcodebuild.log
            exit $XC_STATUS
          fi

      - name: Package .app into CoverLens.ipa
        run: |
          set -eo pipefail
          rm -rf Payload CoverLens.ipa
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/*.app Payload/
          echo "Contents of Payload/CoverLens.app:"
          ls -la Payload/CoverLens.app
          test -f "Payload/CoverLens.app/CoverLens"
          test -f "Payload/CoverLens.app/Info.plist"
          zip -qry CoverLens.ipa Payload
          ls -lh CoverLens.ipa

      - name: Upload CoverLens.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoverLens-iOS-IPA
          path: CoverLens.ipa
          retention-days: 14
          if-no-files-found: error
